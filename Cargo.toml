[package]
name = "arch-notebook"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A Rust desktop workbench for relationship analysis and SQL connection regressions"
license = "MIT"
repository = "https://github.com/pskeffington/arch_notebook"
readme = "README.md"
keywords = ["analyst", "relationships", "sqlite", "visualization"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
quick-xml = "0.41"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38", default-features = false, features = ["fs"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.42", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }

