name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: Linux tests and chart fixture determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libegl1-mesa-dev libgl1-mesa-dev \
            libsqlite3-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run unit and chart-kernel regression tests
        run: cargo test --locked --offline
      - name: Build CLI for SQL automation acceptance
        run: cargo build --locked --offline
      - name: Verify isolated Linux user install and desktop shortcut
        run: |
          python3 scripts/test-linux-user-install-acceptance.py \
            --binary target/debug/arch-notebook \
            --report /tmp/linux-user-install-acceptance.json
      - name: Verify SQL automation and snapshot comparison
        run: |
          python3 scripts/test-sql-automation-acceptance.py \
            --binary target/debug/arch-notebook \
            --source-sql archive/research.databases/sample_connections.sql
      - name: Verify large joined SQL identity capture
        run: |
          python3 scripts/test-sql-scale-acceptance.py \
            --binary target/debug/arch-notebook
      - name: Verify Linux SQL scheduler unit management
        run: |
          python3 scripts/test-linux-sql-scheduler-acceptance.py \
            --binary target/debug/arch-notebook \
            --installer scripts/install-linux-automation.sh \
            --source-sql archive/research.databases/sample_connections.sql \
            --sql-acceptance scripts/test-sql-automation-acceptance.py
      - name: Verify isolated macOS LaunchAgent management
        run: |
          python3 scripts/test-macos-sql-scheduler-acceptance.py \
            --binary target/debug/arch-notebook \
            --installer scripts/install-macos-automation.sh \
            --runner scripts/run-macos-automation.sh \
            --source-sql archive/research.databases/sample_connections.sql \
            --sql-acceptance scripts/test-sql-automation-acceptance.py
      - name: Verify ANX export and import round trip
        run: |
          python3 scripts/test-anx-roundtrip-acceptance.py \
            --binary target/debug/arch-notebook \
            --fixture fixtures/chart/correctness.case.json
      - name: Verify deterministic correctness fixture
        run: |
          python3 scripts/generate-chart-fixtures.py --family correctness --output /tmp/correctness-a.case.json
          python3 scripts/generate-chart-fixtures.py --family correctness --output /tmp/correctness-b.case.json
          cmp /tmp/correctness-a.case.json /tmp/correctness-b.case.json
          python3 -m json.tool /tmp/correctness-a.case.json >/dev/null
          cmp fixtures/chart/correctness.case.json /tmp/correctness-a.case.json
      - name: Verify workload caps and determinism
        run: |
          python3 scripts/generate-chart-fixtures.py --family dense --nodes 10000 --output /tmp/dense-a.case.json
          python3 scripts/generate-chart-fixtures.py --family dense --nodes 10000 --output /tmp/dense-b.case.json
          cmp /tmp/dense-a.case.json /tmp/dense-b.case.json
          test "$(python3 -c 'import json; print(len(json.load(open("/tmp/dense-a.case.json"))["links"]))')" -eq 100000

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            package: linux
            artifact_arch: x86_64
            archive_dir: arch-notebook-linux-x86_64
            archive_name: arch-notebook-linux-x86_64.tar.gz
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            package: linux
            artifact_arch: aarch64
            archive_dir: arch-notebook-linux-aarch64
            archive_name: arch-notebook-linux-aarch64.tar.gz
            target: aarch64-unknown-linux-gnu
          - name: macOS Apple Silicon
            runner: macos-15
            package: macos
            artifact_arch: arm64
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            package: macos
            artifact_arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libegl1-mesa-dev libgl1-mesa-dev \
            libsqlite3-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check packaging script syntax
        run: |
          for script in scripts/install-linux-user.sh scripts/install-linux-automation.sh scripts/install-macos-automation.sh scripts/run-macos-automation.sh scripts/package-macos.sh; do
            bash -n "$script"
          done
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check and build
        # Reuse this target in the macOS bundler instead of rebuilding into target/release.
        run: |
          cargo check --locked --offline --target '${{ matrix.target }}'
          cargo build --release --locked --offline --target '${{ matrix.target }}'
      - name: Package Linux binary archive
        if: matrix.package == 'linux'
        run: |
          mkdir -p "dist/${{ matrix.archive_dir }}"
          install -Dm755 "target/${{ matrix.target }}/release/arch-notebook" "dist/${{ matrix.archive_dir }}/arch-notebook"
          install -Dm644 packaging/arch/arch-notebook.desktop "dist/${{ matrix.archive_dir }}/arch-notebook.desktop"
          install -Dm644 assets/icons/arch-notebook.svg "dist/${{ matrix.archive_dir }}/arch-notebook.svg"
          install -Dm644 assets/icons/arch-notebook.png "dist/${{ matrix.archive_dir }}/arch-notebook.png"
          install -Dm644 packaging/arch/arch-notebook-case.xml "dist/${{ matrix.archive_dir }}/arch-notebook-case.xml"
          install -Dm755 scripts/install-linux-user.sh "dist/${{ matrix.archive_dir }}/install-linux-user.sh"
          install -Dm755 scripts/install-linux-automation.sh "dist/${{ matrix.archive_dir }}/install-linux-automation.sh"
          install -Dm644 LICENSE "dist/${{ matrix.archive_dir }}/LICENSE"
          tar -C dist -czf "dist/${{ matrix.archive_name }}" "${{ matrix.archive_dir }}"
      - name: Package macOS application bundle
        if: matrix.package == 'macos'
        env:
          ARCH_NOTEBOOK_SKIP_BUILD: '1'
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: arch-notebook-${{ matrix.package }}-${{ matrix.artifact_arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  arch-package:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Arch build environment
        run: pacman -Syu --noconfirm --needed base-devel cargo git libglvnd libx11 libxcb libxcursor libxi libxinerama libxkbcommon libxkbcommon-x11 libxrandr libxrender pkgconf rust shadow shared-mime-info sqlite wayland
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && ARCH_NOTEBOOK_SOURCE_DIR='$GITHUB_WORKSPACE' makepkg --noconfirm"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: arch-notebook-archlinux
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  attach-release-assets:
    name: Attach deployment artifacts to published release
    if: github.event_name == 'release'
    needs: [desktop, arch-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: arch-notebook-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" * --clobber
